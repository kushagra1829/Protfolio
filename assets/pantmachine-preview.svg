<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="pm-shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="700" height="450" fill="#F2EFE6" stroke="#000000" stroke-width="3"/>
  
  <!-- Machine schematic frame -->
  <rect x="20" y="20" width="660" height="45" fill="#0B24FF" stroke="#000000" stroke-width="2"/>
  <text x="35" y="47" fill="#F2EFE6" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900">RECYCLING PANT-MACHINE // HCAI IN ROBOTICS (UMEÅ)</text>
  <rect x="525" y="28" width="145" height="28" fill="#FFC800" stroke="#000" stroke-width="1.5"/>
  <text x="535" y="46" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">AI GROUP 1 // SWEDEN</text>

  <!-- Left: Hardware & Sensor Architecture Blueprint -->
  <g transform="translate(20, 80)">
    <rect width="410" height="340" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#pm-shadow)"/>
    <text x="20" y="30" fill="#0B24FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">HARDWARE-IN-THE-LOOP RECOGNITION</text>

    <!-- Schematic: Intake chute -->
    <path d="M 60 60 L 160 60 L 140 120 L 80 120 Z" fill="#E5E7EB" stroke="#000" stroke-width="2"/>
    <text x="90" y="95" fill="#000" font-family="'JetBrains Mono', monospace" font-size="9">CHUTE</text>

    <!-- Optical camera & barcode scanner -->
    <circle cx="210" cy="90" r="16" fill="#FFC800" stroke="#000" stroke-width="2"/>
    <text x="204" y="94" font-size="10">👁</text>
    <line x1="150" y1="90" x2="194" y2="90" stroke="#FFC800" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="180" y="125" fill="#000" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SPECTRAL AI</text>

    <!-- Dual sorting bins -->
    <rect x="40" y="170" width="140" height="130" fill="#E0F2FE" stroke="#000" stroke-width="2"/>
    <text x="50" y="195" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">ALUMINUM CAN BIN</text>
    <text x="50" y="220" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9">• Inductive sensor</text>
    <text x="50" y="240" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9">• Fill-level: 68%</text>
    <rect x="50" y="260" width="120" height="14" fill="#FFF" stroke="#000"/>
    <rect x="50" y="260" width="80" height="14" fill="#0284C7"/>

    <rect x="210" y="170" width="160" height="130" fill="#FEF3C7" stroke="#000" stroke-width="2"/>
    <text x="220" y="195" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">PET PLASTIC BOTTLE BIN</text>
    <text x="220" y="220" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9">• Barcode barcode DB</text>
    <text x="220" y="240" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="9">• Mold-risk: LOW (12%)</text>
    <rect x="220" y="260" width="140" height="14" fill="#FFF" stroke="#000"/>
    <rect x="220" y="260" width="35" height="14" fill="#22C55E"/>

    <!-- Pneumatic diverter valve -->
    <polygon points="175,135 155,160 195,160" fill="#C1272D" stroke="#000" stroke-width="1.5"/>
    <text x="150" y="175" fill="#C1272D" font-family="'JetBrains Mono', monospace" font-size="8">SERVO</text>
  </g>

  <!-- Right: Human-Centered Design Features -->
  <g transform="translate(450, 80)">
    <rect width="230" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#pm-shadow)"/>
    <text x="15" y="28" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">HUMAN-CENTERED FOCUS</text>
    <text x="15" y="55" fill="#000" font-family="'Archivo Black', sans-serif" font-size="18">ZERO CONTAMINATION</text>
    <text x="15" y="85" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">Dynamic user feedback</text>
    <text x="15" y="105" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10">Adaptive intake speed</text>
    <text x="15" y="125" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">✔ SWEDISH PANT ECOSYSTEM</text>

    <g transform="translate(0, 165)">
      <rect width="230" height="165" fill="#8A9BFF" stroke="#000" stroke-width="2" filter="url(#pm-shadow)"/>
      <text x="15" y="28" fill="#000" font-family="'Archivo Black', sans-serif" font-size="16">ROBOTICS TELEMETRY</text>
      <text x="15" y="55" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">• Multi-modal material classifier</text>
      <text x="15" y="78" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">• Humidity &amp; mold sensor</text>
      <text x="15" y="101" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">• Strain-gauge bin weight</text>
      <text x="15" y="124" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">• Edge inference optimization</text>
      <text x="15" y="148" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">GROUP: AI IN ROBOTICS 1</text>
    </g>
  </g>
</svg>