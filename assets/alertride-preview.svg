<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="ar-shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="700" height="450" fill="#F2EFE6" stroke="#000000" stroke-width="3"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="660" height="45" fill="#C1272D" stroke="#000000" stroke-width="2"/>
  <text x="35" y="47" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900">ALERT RIDE HELMET // PATENT-FILED SMART SAFETY HARNESS</text>
  <rect x="520" y="28" width="150" height="28" fill="#FFC800" stroke="#000" stroke-width="1.5"/>
  <text x="532" y="46" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">★ 1 PATENT FILED</text>

  <!-- Left: Helmet Hardware System Layout -->
  <g transform="translate(20, 80)">
    <rect width="420" height="340" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#ar-shadow)"/>
    <text x="20" y="30" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">EMBEDDED SENSOR INTEGRATION ARCHITECTURE</text>

    <!-- Helmet Profile Curve -->
    <path d="M 60 250 C 60 120, 180 80, 290 80 C 370 80, 390 140, 390 200 C 390 240, 340 260, 280 260 L 260 220 L 130 220 L 110 250 Z" 
          fill="#1E293B" stroke="#000" stroke-width="3"/>

    <!-- Sensor 1: MPU6050 Accelerometer / Impact detection -->
    <circle cx="280" cy="115" r="10" fill="#FFC800" stroke="#000" stroke-width="1.5"/>
    <line x1="280" y1="115" x2="330" y2="70" stroke="#FFC800" stroke-width="1.5"/>
    <rect x="315" y="50" width="90" height="22" fill="#FFC800" stroke="#000"/>
    <text x="320" y="65" fill="#000" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">IMPACT MPU6050</text>

    <!-- Sensor 2: IR Eye-Blink Drowsiness Detection -->
    <circle cx="340" cy="180" r="10" fill="#38BDF8" stroke="#000" stroke-width="1.5"/>
    <line x1="340" y1="180" x2="280" y2="150" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="220" y="140" width="105" height="22" fill="#38BDF8" stroke="#000"/>
    <text x="225" y="155" fill="#000" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">IR BLINK DROWSINESS</text>

    <!-- Microcontroller hub &amp; GSM Distress Module -->
    <rect x="150" y="275" width="130" height="45" fill="#0B24FF" stroke="#000" stroke-width="2"/>
    <text x="160" y="295" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">GSM / GPS DISPATCH</text>
    <text x="160" y="310" fill="#FFC800" font-family="'JetBrains Mono', monospace" font-size="8">LAT/LONG SMS ALERT</text>

    <!-- Buzzer audio alarm -->
    <circle cx="100" cy="170" r="12" fill="#C1272D" stroke="#000" stroke-width="1.5"/>
    <text x="96" y="174" fill="#FFF" font-size="9">🔊</text>
    <text x="45" y="195" fill="#C1272D" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold">ALARM CHIME</text>
  </g>

  <!-- Right: Verification &amp; Patent Information -->
  <g transform="translate(460, 80)">
    <rect width="220" height="150" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#ar-shadow)"/>
    <text x="15" y="25" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">INTELLECTUAL PROPERTY</text>
    <text x="15" y="55" fill="#C1272D" font-family="'Archivo Black', sans-serif" font-size="20">PATENT FILED</text>
    <text x="15" y="80" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">INTELLIGENT TWO-WHEELER</text>
    <text x="15" y="95" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">SAFETY APPARATUS</text>
    <line x1="15" y1="110" x2="205" y2="110" stroke="#E5E7EB" stroke-width="1"/>
    <text x="15" y="130" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ORIGIN: SRM CHENNAI</text>

    <g transform="translate(0, 165)">
      <rect width="220" height="165" fill="#0B24FF" stroke="#000" stroke-width="2" filter="url(#ar-shadow)"/>
      <text x="15" y="28" fill="#FFC800" font-family="'Archivo Black', sans-serif" font-size="16">FAIL-SAFE LOGIC</text>
      <text x="15" y="55" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10">• Threshold impact g-force</text>
      <text x="15" y="78" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10">• Microsleep closure timer</text>
      <text x="15" y="101" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10">• Automated SOS broadcast</text>
      <text x="15" y="124" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10">• Real-time vehicle kill-switch</text>
      <text x="15" y="148" fill="#FFC800" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">SAVING LIVES FIRST</text>
    </g>
  </g>
</svg>