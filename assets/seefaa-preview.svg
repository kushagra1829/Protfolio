<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="sf-shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="700" height="450" fill="#F2EFE6" stroke="#000000" stroke-width="3"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="660" height="45" fill="#000000" stroke="#000000" stroke-width="2"/>
  <text x="40" y="48" fill="#FFC800" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900">SEEFAA // CFA LEVEL I EXAM INTEL PLATFORM</text>
  <rect x="520" y="28" width="145" height="28" fill="#0B24FF" stroke="#FFF" stroke-width="1.5"/>
  <text x="532" y="47" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">SUPABASE AUTH</text>

  <!-- Left: Question & Logic Card -->
  <g transform="translate(20, 80)">
    <rect width="420" height="340" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#sf-shadow)"/>
    <rect x="20" y="20" width="140" height="25" fill="#8A9BFF" stroke="#000" stroke-width="1.5"/>
    <text x="28" y="37" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">TOPIC: ETHICAL STDS</text>
    
    <text x="20" y="80" fill="#000" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Question 42 of 180 (Mock Session)</text>
    <text x="20" y="110" fill="#4B5563" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Under Standard VI(B) Priority of Transactions, which of</text>
    <text x="20" y="130" fill="#4B5563" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">the following actions must take absolute precedent?</text>

    <!-- Multiple choice options -->
    <rect x="20" y="160" width="380" height="42" fill="#F2EFE6" stroke="#000" stroke-width="1.5"/>
    <text x="35" y="185" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11">A. Personal trading accounts</text>

    <rect x="20" y="215" width="380" height="42" fill="#E0E7FF" stroke="#0B24FF" stroke-width="2"/>
    <text x="35" y="240" fill="#0B24FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">B. Client transactions over employer accounts</text>
    <circle cx="380" cy="236" r="8" fill="#0B24FF"/>
    <text x="377" y="239" fill="#FFF" font-size="10">✓</text>

    <rect x="20" y="270" width="380" height="42" fill="#F2EFE6" stroke="#000" stroke-width="1.5"/>
    <text x="35" y="295" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11">C. Proprietary corporate hedging</text>
  </g>

  <!-- Right: Retention analytics -->
  <g transform="translate(460, 80)">
    <rect width="220" height="155" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#sf-shadow)"/>
    <text x="15" y="28" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ACCURACY TRACKER</text>
    <text x="15" y="65" fill="#0B24FF" font-family="'Archivo Black', sans-serif" font-size="34">84.6%</text>
    <text x="15" y="90" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">▲ 92ND PERCENTILE</text>

    <line x1="15" y1="110" x2="200" y2="110" stroke="#E5E7EB" stroke-width="1"/>
    <text x="15" y="130" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">10 SUB-DISCIPLINES</text>
    <text x="15" y="145" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">SPACED REPETITION ENGINE</text>

    <!-- Tech Stack Pill Box -->
    <g transform="translate(0, 175)">
      <rect width="220" height="165" fill="#FFC800" stroke="#000000" stroke-width="2" filter="url(#sf-shadow)"/>
      <text x="15" y="28" fill="#000" font-family="'Archivo Black', sans-serif" font-size="16">ARCHITECTURE</text>
      <text x="15" y="55" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11">• LOVABLE FRONTEND</text>
      <text x="15" y="80" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11">• SUPABASE POSTGRES</text>
      <text x="15" y="105" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11">• ROW LEVEL SECURITY</text>
      <text x="15" y="130" fill="#000" font-family="'JetBrains Mono', monospace" font-size="11">• AUTH-GATED MOCKS</text>
      <text x="15" y="150" fill="#0B24FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">ZERO DATA LEAKAGE</text>
    </g>
