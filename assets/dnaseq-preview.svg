<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="dna-shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>
  <rect width="700" height="450" fill="#05081E" stroke="#8A9BFF" stroke-width="3"/>

  <!-- Top Terminal Header -->
  <rect x="20" y="20" width="660" height="45" fill="#00008B" stroke="#8A9BFF" stroke-width="1.5"/>
  <text x="35" y="47" fill="#F2EFE6" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="900">DNA_JACCARD_SIMD // C++ PERFORMANCE PROGRAMMING (UMEÅ)</text>
  <rect x="540" y="28" width="130" height="28" fill="#FFC800" stroke="#000" stroke-width="1"/>
  <text x="548" y="46" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="900">k ∈ [1, 32]</text>

  <!-- Left: Performance Graph Chart -->
  <g transform="translate(30, 85)">
    <rect width="420" height="330" fill="#0A0E2A" stroke="#8A9BFF" stroke-width="1.5"/>
    <text x="20" y="30" fill="#8A9BFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">STRATEGY CROSSOVER BENCHMARK (k vs CPU CLOCKS)</text>
    
    <!-- Axes -->
    <line x1="50" y1="280" x2="390" y2="280" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="280" x2="50" y2="50" stroke="#475569" stroke-width="2"/>
    
    <text x="360" y="300" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">k-mer size</text>
    <text x="15" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">time (ms)</text>

    <!-- Grid lines -->
    <line x1="50" y1="220" x2="390" y2="220" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="50" y1="160" x2="390" y2="160" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="50" y1="100" x2="390" y2="100" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Strategy A: Bitset Direct Array (fast at small k) -->
    <path d="M 50 240 Q 150 230 200 190 T 380 70" fill="none" stroke="#38BDF8" stroke-width="3"/>
    <text x="260" y="90" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">ARRAY / BITSET</text>

    <!-- Strategy B: Hash / Sorted Inverted Index (fast at large k) -->
    <path d="M 50 90 Q 140 120 200 190 T 380 235" fill="none" stroke="#FFC800" stroke-width="3"/>
    <text x="260" y="250" fill="#FFC800" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SORTED SET HASH</text>

    <!-- Crossover point annotation at k≈12-13 -->
    <circle cx="200" cy="190" r="6" fill="#F43F5E" stroke="#FFF" stroke-width="2"/>
    <line x1="200" y1="190" x2="200" y2="280" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="160" y="300" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">k ≈ 12–13</text>
    <rect x="135" y="145" width="130" height="24" fill="#F43F5E" rx="3"/>
    <text x="142" y="161" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">CRITICAL CROSSOVER</text>
  </g>

  <!-- Right: Technical parameters -->
  <g transform="translate(470, 85)">
    <rect width="210" height="150" fill="#0A0E2A" stroke="#8A9BFF" stroke-width="1.5"/>
    <text x="15" y="28" fill="#FFC800" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">METRICS &amp; TUNING</text>
    <text x="15" y="55" fill="#F2EFE6" font-family="'JetBrains Mono', monospace" font-size="11">• k-mer range: 1–32</text>
    <text x="15" y="80" fill="#F2EFE6" font-family="'JetBrains Mono', monospace" font-size="11">• 2 Algorithmic paths</text>
    <text x="15" y="105" fill="#F2EFE6" font-family="'JetBrains Mono', monospace" font-size="11">• Cache miss minimization</text>
    <text x="15" y="130" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">• SIMD vectorization</text>

    <g transform="translate(0, 165)">
      <rect width="210" height="165" fill="#FFC800" stroke="#000" stroke-width="2"/>
      <text x="15" y="30" fill="#000" font-family="'Archivo Black', sans-serif" font-size="16">KEY DISCOVERY</text>
      <text x="15" y="60" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">Bitset array dominates</text>
      <text x="15" y="75" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">for k &lt; 12 due to</text>
      <text x="15" y="90" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">zero-allocation indexing.</text>
      <text x="15" y="115" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">Sorted hashing wins</text>
      <text x="15" y="130" fill="#000" font-family="'JetBrains Mono', monospace" font-size="10">for sparse k &gt; 13.</text>
      <text x="15" y="152" fill="#0B24FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">O(N) vs O(4^k)</text>
    </g>
  </g>
</svg>