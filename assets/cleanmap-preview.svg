<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="100%" height="100%">
  <defs>
    <filter id="bm-shadow">
      <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>
  <!-- Background Board -->
  <rect width="700" height="450" fill="#F2EFE6" stroke="#000000" stroke-width="3"/>
  
  <!-- App Header -->
  <rect x="20" y="20" width="660" height="45" fill="#0B24FF" stroke="#000000" stroke-width="2"/>
  <circle cx="45" cy="42" r="6" fill="#FF5F56"/>
  <circle cx="65" cy="42" r="6" fill="#FFBD2E"/>
  <circle cx="85" cy="42" r="6" fill="#27C93F"/>
  <text x="120" y="47" fill="#F2EFE6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900">CLEANMAP.OS // COMMUNITY WASTE TELEMETRY</text>
  <rect x="540" y="28" width="125" height="28" fill="#FFC800" stroke="#000000" stroke-width="1.5"/>
  <text x="550" y="47" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">● LIVE RUNTIME</text>

  <!-- Left: Map Grid Area -->
  <g transform="translate(20, 80)">
    <rect width="400" height="340" fill="#E5E7EB" stroke="#000000" stroke-width="2"/>
    <!-- Map streets -->
    <path d="M 0 100 Q 150 120 400 80" stroke="#9CA3AF" stroke-width="14" fill="none"/>
    <path d="M 0 250 L 400 230" stroke="#9CA3AF" stroke-width="10" fill="none"/>
    <path d="M 120 0 L 140 340" stroke="#9CA3AF" stroke-width="12" fill="none"/>
    <path d="M 280 0 L 260 340" stroke="#9CA3AF" stroke-width="10" fill="none"/>
    
    <!-- Waste Pins -->
    <g transform="translate(130, 95)" filter="url(#bm-shadow)">
      <circle cx="0" cy="0" r="14" fill="#C1272D" stroke="#000" stroke-width="2"/>
      <text x="-5" y="4" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">!</text>
      <rect x="18" y="-12" width="130" height="26" fill="#FFF" stroke="#000" stroke-width="1.5"/>
      <text x="25" y="5" fill="#000" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">HOTSPOT: CLAIMED</text>
    </g>

    <g transform="translate(270, 220)" filter="url(#bm-shadow)">
      <circle cx="0" cy="0" r="14" fill="#22C55E" stroke="#000" stroke-width="2"/>
      <text x="-5" y="4" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">✓</text>
      <rect x="18" y="-12" width="135" height="26" fill="#FFF" stroke="#000" stroke-width="1.5"/>
      <text x="25" y="5" fill="#000" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">CLEANUP VERIFIED</text>
    </g>
  </g>

  <!-- Right: Telemetry & Leaderboard -->
  <g transform="translate(440, 80)">
    <!-- Stat card 1 -->
    <rect width="240" height="95" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#bm-shadow)"/>
    <text x="15" y="25" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">VERIFIED CLEANUPS</text>
    <text x="15" y="65" fill="#0B24FF" font-family="'Archivo Black', sans-serif" font-size="34">1,420+</text>
    <text x="15" y="85" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">▲ 3 HACKATHONS WON</text>

    <!-- Stat card 2 -->
    <g transform="translate(0, 115)">
      <rect width="240" height="110" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#bm-shadow)"/>
      <text x="15" y="25" fill="#6B7280" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">COMMUNITY VOLUNTEERS</text>
      <text x="15" y="65" fill="#000000" font-family="'Archivo Black', sans-serif" font-size="34">580+</text>
      <rect x="15" y="75" width="200" height="18" fill="#F2EFE6" stroke="#000"/>
      <rect x="15" y="75" width="160" height="18" fill="#FFC800"/>
      <text x="22" y="88" fill="#000" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900">80% RESOLUTION RATIO</text>
    </g>

    <!-- Hackathon badge -->
    <g transform="translate(0, 245)">
      <rect width="240" height="85" fill="#FFC800" stroke="#000000" stroke-width="2" filter="url(#bm-shadow)"/>
      <text x="15" y="28" fill="#000000" font-family="'Archivo Black', sans-serif" font-size="16">WINNER PODIUM</text>
      <text x="15" y="50" fill="#000000" font-family="'JetBrains Mono', monospace" font-size="11">SRM HACKATHON CIRCUIT</text>
      <text x="15" y="70" fill="#0B24FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900">FULL-STACK GEO-DISPATCH</text>
    </g>
  </g>
</svg>