<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 530" width="100%" height="100%">
  <defs>
    <filter id="polaroid-shadow">
      <feDropShadow dx="8" dy="10" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Tape strip on top corner -->
  <g transform="rotate(-6, 225, 260)" filter="url(#polaroid-shadow)">
    <!-- White paper body -->
    <rect x="30" y="30" width="380" height="460" fill="#FAF8F2" stroke="#000000" stroke-width="3" rx="4"/>
    
    <!-- Photo area -->
    <rect x="55" y="55" width="330" height="320" fill="#0B24FF" stroke="#000000" stroke-width="2"/>
    
    <!-- Photo scene: Winter / North Sweden tech desk with code editor &amp; snowy window -->
    <g transform="translate(55, 55)">
      <rect width="330" height="320" fill="#0F172A"/>
      
      <!-- Window view with snow trees &amp; northern light -->
      <path d="M 20 20 L 150 20 L 150 160 L 20 160 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
      <path d="M 20 50 Q 85 25 150 55" fill="none" stroke="#4ADE80" stroke-width="3" opacity="0.6"/>
      <!-- Snow pines -->
      <polygon points="50,140 40,160 60,160" fill="#FFFFFF"/>
      <polygon points="90,120 75,160 105,160" fill="#FFFFFF"/>
      <polygon points="125,135 115,160 135,160" fill="#FFFFFF"/>
      
      <!-- Laptop on desk -->
      <rect x="130" y="190" width="160" height="95" rx="4" fill="#000000" stroke="#FFC800" stroke-width="2"/>
      <rect x="140" y="200" width="140" height="75" fill="#05081E"/>
      <text x="145" y="215" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8">&gt; git clone umea-hcai</text>
      <text x="145" y="230" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="8">&gt; build --target=robotics</text>
      <text x="145" y="245" fill="#FFC800" font-family="'JetBrains Mono', monospace" font-size="8">&gt; 13.08°N ➔ 63.82°N</text>
      <text x="145" y="260" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="8">&gt; status: 100% compiled</text>
      
      <!-- Desk base -->
      <line x1="20" y1="285" x2="310" y2="285" stroke="#94A3B8" stroke-width="4"/>
      <!-- Coffee mug -->
      <rect x="80" y="255" width="25" height="30" rx="3" fill="#E2E8F0" stroke="#000"/>
      <path d="M 105 262 C 115 262 115 278 105 278" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M 90 248 Q 92 242 90 236" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    </g>

    <!-- Polaroid handwritten bottom note -->
    <text x="65" y="420" fill="#000" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700">Umeå Campus · 63.82° N</text>
    <text x="65" y="455" fill="#0B24FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">TRANSIT POINT: HCAI LAB · AUTUMN 2026</text>
  </g>

  <!-- Yellow masking tape strip on top right -->
  <g transform="translate(260, 5) rotate(15)">
    <rect width="100" height="32" fill="#FFC800" opacity="0.9" stroke="#000" stroke-width="1.5"/>
    <line x1="5" y1="6" x2="95" y2="6" stroke="#E0A800" stroke-width="1"/>
  </g>
</svg>